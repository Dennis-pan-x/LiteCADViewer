[package]
name = "litecad-viewer"
description = "LiteCADViewer: a lightweight read-only CAD drawing viewer"
version = "0.1.2"
edition.workspace = true
license.workspace = true
publish = false
authors = ["Dennis-pan"]
repository.workspace = true

[lints]
workspace = true

[dependencies]
cadcraft-io.workspace = true
cadcraft-doc.workspace = true
cadcraft-geom.workspace = true
cadcraft-render.workspace = true
cadcraft-render-wgpu.workspace = true
cadcraft-color.workspace = true
eframe = { workspace = true, features = ["wgpu", "default_fonts", "accesskit", "wayland", "x11"] }
egui.workspace = true
egui-wgpu.workspace = true
rfd.workspace = true
serde_json.workspace = true
image.workspace = true
craft-ui.workspace = true

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
